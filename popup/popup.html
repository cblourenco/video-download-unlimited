<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Download Unlimited</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="Logo" class="brand-icon">
        <div class="brand-text">
          <h1>Video Download</h1>
          <span class="brand-badge">UNLIMITED</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-sidepanel" class="icon-btn" title="Abrir no Painel Lateral">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Configurações">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Info -->
    <div class="page-meta">
      <span id="page-title" class="page-title">Detectando mídia...</span>
      <button id="btn-refresh" class="btn-rescan" title="Forçar Releitura da Página">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Atualizar
      </button>
    </div>

    <!-- Barra de Filtros Rápidos -->
    <div class="filter-section">
      <div class="filter-pills">
        <button id="filter-all" class="filter-pill" data-filter="all">
          Todos <span class="badge" id="badge-all">0</span>
        </button>
        <button id="filter-pending" class="filter-pill active" data-filter="pending">
          Pendentes <span class="badge" id="badge-pending">0</span>
        </button>
        <button id="filter-downloaded" class="filter-pill" data-filter="downloaded">
          Baixados <span class="badge" id="badge-downloaded">0</span>
        </button>
      </div>
    </div>

    <!-- Barra de Ações em Lote (Baixar Todos / Selecionados / Cancelar) -->
    <div id="batch-actions-bar" class="batch-bar hidden">
      <div class="batch-selection-wrap">
        <label class="custom-checkbox select-all-label" title="Selecionar ou desmarcar todos os visíveis">
          <input type="checkbox" id="checkbox-select-all">
          <span class="checkmark"></span>
          <span id="batch-count" class="batch-count">0 pendentes</span>
        </label>
      </div>
      <div class="batch-buttons">
        <button id="btn-cancel-all" class="btn-cancel-all hidden" title="Cancelar downloads">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Cancelar
        </button>
        <button id="btn-download-all" class="btn-download-all" title="Baixar vídeos selecionados ou todos">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Baixar Todos
        </button>
      </div>
    </div>

    <!-- Media List -->
    <main class="media-list-container">
      <div id="media-list" class="media-list">
        <!-- Renderizado dinamicamente via popup.js -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon-wrap">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="1.5">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <h3>Nenhum vídeo detectado</h3>
        <p>Inicie a reprodução do vídeo na página para que a captura seja acionada automaticamente.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span class="version-tag">v1.0.0</span>
      <button id="btn-history" class="footer-link">Ver Histórico</button>
    </footer>

    <!-- Modal de Confirmação para Vídeo Já Baixado -->
    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-icon warning">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
          <h3 class="modal-title">Vídeo Já Baixado</h3>
        </div>
        <div class="modal-body">
          <p id="modal-video-title" class="modal-video-name"></p>
          <p class="modal-desc">Este arquivo já foi salvo no seu computador anteriormente.</p>
          <p class="modal-sub">Deseja fazer o download novamente?</p>
        </div>
        <div class="modal-actions">
          <button id="modal-btn-cancel" class="modal-btn btn-secondary">Cancelar</button>
          <button id="modal-btn-confirm" class="modal-btn btn-primary">Baixar Novamente</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
